# =============================================================================
# Moussidalheire - configuration Nginx de production
# =============================================================================
#
# Installation :
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/moussidalheire
#   sudo ln -s /etc/nginx/sites-available/moussidalheire /etc/nginx/sites-enabled/
#   sudo nginx -t          # valide la syntaxe AVANT de recharger
#   sudo systemctl reload nginx
#
# Avant de recharger, remplacer partout :
#   - moussidalheire.example        -> le vrai domaine
#   - /var/www/moussidalheire       -> le chemin de deploiement reel
#
# Architecture servie ici :
#   /                 -> SPA React statique (frontend/dist)
#   /api/v1/...       -> API Express (127.0.0.1:5000)
#   /storage/photos/  -> photos de profil uploadees, servies par Express
#   /api-docs         -> Swagger UI (a restreindre, voir plus bas)
# =============================================================================


# --- Redirection HTTP -> HTTPS ----------------------------------------------
# Obligatoire pour une PWA : un Service Worker ne s'enregistre QUE sur une
# origine securisee (HTTPS, ou localhost en dev). En HTTP simple, sw.js est
# ignore par le navigateur et l'app n'est pas installable.
server {
    listen 80;
    listen [::]:80;
    server_name moussidalheire.example www.moussidalheire.example;

    # Laisse passer le renouvellement Certbot sans redirection.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name moussidalheire.example www.moussidalheire.example;

    # --- TLS ----------------------------------------------------------------
    # Chemins generes par : sudo certbot --nginx -d moussidalheire.example
    ssl_certificate     /etc/letsencrypt/live/moussidalheire.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moussidalheire.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Racine du frontend -------------------------------------------------
    # Contenu de `npm run build` cote frontend/, soit frontend/dist/.
    root  /var/www/moussidalheire/frontend/dist;
    index index.html;

    # Taille max des uploads. Multer limite les photos a 5 Mo
    # (backend/src/middlewares/upload.middleware.ts) ; on laisse un peu de
    # marge pour que ce soit l'API qui renvoie son erreur propre plutot que
    # Nginx un 413 brut.
    client_max_body_size 6M;

    # --- Compression --------------------------------------------------------
    # Ne jamais compresser les images : deja compressees, gzip ne fait que
    # bruler du CPU.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript
                      application/json application/manifest+json
                      image/svg+xml;

    # --- En-tetes de securite ----------------------------------------------
    # Attention : add_header ne s'herite PAS dans un bloc location qui declare
    # ses propres add_header. Les locations ci-dessous qui ajoutent un
    # Cache-Control redeclarent donc ce dont elles ont besoin.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # =========================================================================
    # PWA - les trois fichiers qui ne doivent JAMAIS etre caches longtemps
    # =========================================================================
    #
    # Ces fichiers n'ont pas de hash dans leur nom : leur URL est stable d'un
    # deploiement a l'autre, seul leur contenu change. Les mettre en cache
    # longue duree fige l'application sur une version obsolete.
    #
    # Cas le plus grave, sw.js : le navigateur garde l'ancien Service Worker,
    # `registerType: 'autoUpdate'` (frontend/vite.config.ts) ne se declenche
    # jamais, et les utilisateurs restent bloques sur un build perime - parfois
    # definitivement, puisque c'est le SW lui-meme qui sert le reste.
    #
    # `expires off` empeche Nginx d'emettre ses propres Expires/Cache-Control,
    # qui feraient doublon avec le add_header ci-dessous.

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires off;

        # =404 explicite : sans ca, un fichier manquant (deploiement partiel,
        # mauvais root) tomberait sur le try_files du bloc `location /` et
        # renverrait index.html avec un Content-Type text/html. Le navigateur
        # refuse alors d'enregistrer le Service Worker :
        #   "The script has an unsupported MIME type ('text/html')"
        # Un 404 franc est bien plus facile a diagnostiquer.
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires off;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires off;
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires off;
        try_files $uri =404;
    }

    # Le runtime Workbox (workbox-<hash>.js) est genere a la racine de dist/,
    # pas dans assets/. Son nom est hashe, donc immutable sans risque.
    location ~ ^/workbox-[0-9a-f]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires off;
        try_files $uri =404;
    }

    # =========================================================================
    # Assets hashes - cache immutable
    # =========================================================================
    #
    # Tout ce que Vite ecrit dans assets/ porte un hash de contenu
    # (index-CGuVUY3A.js, logo-C5l5uXJO.jpeg...). Un changement de contenu
    # change le nom du fichier : l'URL peut donc etre mise en cache un an sans
    # risque de servir du perime. `immutable` evite en plus les requetes de
    # revalidation lors d'un rechargement de page.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires off;
        access_log off;
        try_files $uri =404;
    }

    # Icones PWA et favicon : noms stables (pas de hash), donc duree moderee
    # plutot qu'immutable - sinon un changement de logo mettrait un an a se
    # propager.
    location ~* ^/(favicon\.jpg|pwa-\d+x\d+\.png)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires off;
        access_log off;
        try_files $uri =404;
    }

    # =========================================================================
    # API backend (Express, port 5000)
    # =========================================================================
    #
    # Place AVANT le `location /` du SPA. Nginx donne de toute facon la
    # priorite au prefixe le plus long, mais l'ordre de lecture reste plus
    # clair ainsi.
    #
    # Note backend : express-rate-limit ne verra que 127.0.0.1 comme IP source
    # si Express ne fait pas confiance au proxy. Prevoir `app.set("trust proxy", 1)`
    # cote backend, sinon le rate limiting compte tous les visiteurs comme un
    # seul client.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Une reponse d'API ne doit jamais etre mise en cache par le
        # navigateur : les donnees changent, et certaines reponses dependent du
        # jeton d'authentification.
        add_header Cache-Control "no-store" always;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Photos de profil uploadees, servies par Express depuis storage/photos
    # (voir backend/src/app.ts). Noms de fichiers generes a l'upload, donc
    # stables : on peut les laisser en cache cote navigateur.
    location /storage/photos/ {
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Express pose deja Cross-Origin-Resource-Policy: cross-origin sur ce
        # chemin ; ne pas l'ecraser ici, sinon les <img> cessent de s'afficher.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # Documentation Swagger. En production, soit on la supprime, soit on la
    # protege - elle expose toute la surface de l'API.
    location /api-docs {
        # Decommenter pour restreindre a un reseau de confiance :
        # allow 192.168.1.0/24;
        # deny  all;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # SPA - fallback React Router
    # =========================================================================
    #
    # try_files teste $uri EN PREMIER : tant que sw.js, manifest.webmanifest et
    # les assets existent sur le disque, ils sont servis tels quels et ne
    # passent jamais par index.html. Le fallback ne concerne que les routes
    # client (/personnes, /arbre, /actualites...), qui n'ont pas de fichier
    # correspondant.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
